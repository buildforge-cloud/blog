name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - run: docker compose up -d --build blog_app

      - name: Health check
        run: |
          sleep 5
          curl -f http://127.0.0.1:8082/ > /dev/null
