name: CI

permissions:
  contents: read

on:
  # blog#85: a run on main saves the Playwright browser cache where every
  # pull request can read it (a pull request's own cache is its own only).
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: "📦 Install dependencies"
        run: npm install

      - name: "🔎 Lint code"
        run: npm run lint

      - name: "🧪 Test workflows"
        run: npm test

      - name: "📝 Checking code format"
        run: npm run format:check

      # blog#64: the fonts come from the repo. Google's font hosts point
      # nowhere from here on, so a build that still fetches a font fails.
      # The loop proves the block took: no host may resolve to a real address.
      - name: "🚫 Block Google's font hosts"
        run: |
          echo "0.0.0.0 fonts.google.com fonts.googleapis.com fonts.gstatic.com" | sudo tee -a /etc/hosts
          for host in fonts.google.com fonts.googleapis.com fonts.gstatic.com; do
            if getent ahosts "$host" | awk '{print $1}' | grep -vx '0.0.0.0'; then
              echo "::error::$host still resolves to a real address"
              exit 1
            fi
          done

      - name: "🚀 Build the project"
        run: npm run build

      # blog#85: `--with-deps` runs apt-get, and a dead apt mirror hung CI
      # three times on 2026-11-11. The browser is cached, keyed on the runner
      # image and the @playwright/test version in package-lock.json, and
      # apt-get runs only on a miss; on a hit the image already has Chromium's
      # libraries. A stalled restore falls through to the install, and the
      # save is a step of its own so that it has a bound too.
      - name: "🔢 Read the runner image and the Playwright version"
        id: playwright
        run: |
          echo "image=${ImageOS:?the runner image is unknown}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: "🗄️ Restore the Playwright browser"
        id: playwright-cache
        uses: actions/cache/restore@v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}

      - name: "🎭 Install Chromium for Playwright"
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: npx playwright install --with-deps chromium

      - name: "🗄️ Save the Playwright browser"
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: "🎨 Check text contrast on the built site"
        run: npm run test:pages
