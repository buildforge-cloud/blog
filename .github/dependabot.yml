version: 2
# Monthly, every ecosystem (Stefan, card 4454; blog#116), in the shape of
# buildforge-starter's web template (stages-v1.1.0, buildforge-starter#458):
# one update round a month, and each ecosystem's routine (minor and patch)
# bumps in ONE pull request, so the blog takes them in a few deploys a month.
# The month's majors come in a second PR, the `majors` group (Stefan 4807,
# blog#135), apart from the routine one, since majors are the ones that break.
# `applies-to` stays at its default (version-updates), so a security fix is
# never held behind the month's batch: GitHub opens those at once, when the
# repo setting "Dependabot security updates" is on. Every entry waits a week
# before it offers a new release (cooldown): a hijacked release is usually
# caught by then. The cooldown holds back version updates only.
#
# ⚠️ An `ignore` below holds back security updates too: while it stands, a
# security fix only in an ignored version gets no PR, and is moved by hand.
#
# No `target-branch`: the blog has no staging, so PRs go to main, and CI runs
# on GitHub's own runner. A Dependabot branch can start no self-hosted job
# (deploy.yml runs on a push to main and on its schedule only).
#
# No docker-compose entry: docker-compose.yml builds the site (`build: .`)
# and runs no image of its own, so it has nothing to move, and no database
# image whose major would need ignoring. No pip entry: the Python files here
# are scripts with no requirements file.
#
# tests/dependabot.test.mjs fails on a missing or extra ecosystem, an entry
# that is not monthly, one without its minor-and-patch and majors groups, or
# a group that takes security fixes.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      majors:
        patterns:
          - "*"
        update-types:
          - "major"
    cooldown:
      default-days: 7
    # No astro ignore since blog#145: @astrojs/mdx 8 lifted blog#83's cap,
    # and tests/dependabot.test.mjs fails if the ignore comes back.
    #
    # blog#145: TypeScript 7 has dropped the JS API that @astrojs/check
    # (peer ^5 || ^6) and @typescript-eslint/parser (peer <6.1.0) use, so in
    # the month's majors group it turns the whole PR red at npm install.
    # tests/dependabot.test.mjs fails once no locked peer range refuses 7:
    # then this goes. Until then a TypeScript fix only in 7 is moved by hand.
    ignore:
      - dependency-name: typescript
        versions:
          - ">= 7"
  # Every workflow runs another repo's action by tag (actions/checkout@v4).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      majors:
        patterns:
          - "*"
        update-types:
          - "major"
    cooldown:
      default-days: 7
  # The Dockerfile's base images. deploy.yml builds with `--pull` (blog#111),
  # so a new image of the same tag arrives on its own. node:22-alpine names a
  # major only, so what this moves is the major (node 22 -> 24, in the majors
  # group's PR; ci.yml's `node-version` moves with it by hand). nginx:alpine
  # names no version, and `--pull` alone keeps it fresh. So today the
  # minor-and-patch group never fills: it is there for a tag that names a
  # minor, and so that a new base image's routine bumps share one PR.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      majors:
        patterns:
          - "*"
        update-types:
          - "major"
    cooldown:
      default-days: 7
    # Dependabot offers the newest major. 23 and 25 are odd majors, six-month
    # Current releases and never an LTS, so they are held back and the PR
    # names 24 or 26 instead. From 27 on, Node ships one major a year and
    # each one becomes LTS (nodejs.org, "Evolving the Node.js Release
    # Schedule"), so this list ends at 25.
    ignore:
      - dependency-name: node
        versions:
          - ">= 23, < 24"
          - ">= 25, < 26"
