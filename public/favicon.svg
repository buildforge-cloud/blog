<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    The BuildForge mark, copied verbatim from profile-homepage/favicon.svg on
    2026-09-10 so the studio site and the blog share one icon in the tab strip.
    Read that file's comment before editing this one; in particular, keep two
    consecutive hyphens out of an XML comment, which once made the whole file
    parse as an error document and render no icon at all.

    The shell flips to paper under prefers-color-scheme: dark because browser
    chrome has its own theme. That is about the TAB, not about the page: the
    site itself is paper-only, see src/styles/theme.css.
  -->
  <style>
    .shell { fill: none; stroke: #141a22; stroke-width: 8; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) { .shell { stroke: #f5f2ea; } }
  </style>
  <path class="shell" d="M50 4 L89.8 27 V73 L50 96 L10.2 73 V27 Z"/>
  <path d="M50 23.6 L73 36.7 V44.1 L66.3 50 L73 55.9 V63.3 L50 76.4 L27 63.3 V36.7 Z" fill="#e8542a"/>
</svg>
