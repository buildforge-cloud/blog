# ⚠️ nginx drops every `add_header` of the level above in a block that sets
# one of its own, and says nothing. Until blog#21 the `.html` block set
# Cache-Control, so no page got the security headers below. So no block here
# calls `add_header`: these maps pick Cache-Control and Pragma by path, and
# only the `server` level sends headers. A location sets `expires` and
# logging only. An empty value sends no header. `npm test` fails on a block
# that drops a header (tests/nginx-headers.test.mjs).
#
# The first regex that matches wins, in this order, so it follows the
# locations: `^~ /_astro/` and `^~ /pagefind/` before the image regex.
map $uri $cache_control {
    default "";
    # Astro's own build output: every file under /_astro/ has a content
    # hash baked into its filename, so it's safe to cache indefinitely.
    ~^/_astro/ "public, immutable";
    # Pagefind's search index (unhashed filenames, but only fetched by the
    # search UI itself, not render-blocking) — moderate cache is enough.
    ~^/pagefind/ "public";
    ~*\.(jpg|jpeg|png|gif|webp|ico|svg)$ "public, immutable";
    # Always re-validate HTML so a new deploy shows up immediately
    ~*\.html$ "no-cache, must-revalidate";
}

map $uri $pragma {
    default "";
    ~*\.html$ "no-cache";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression (Traefik also handles this, but keeping for redundancy)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json
               application/xml+rss image/svg+xml;

    # Without `always`, as before blog#21: a 404 gets no cache rule.
    add_header Cache-Control $cache_control;
    add_header Pragma $pragma;

    # Security headers. The CSP runs no inline script: every script is a file
    # in /_astro/ (astro.config.ts). 'wasm-unsafe-eval' lets Pagefind's
    # search compile its WebAssembly, and allows no JavaScript eval. giscus
    # loads its script, a stylesheet and its comments frame from giscus.app.
    # tests/csp.spec.mjs opens every page under this CSP (blog#21).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://giscus.app; font-src 'self' data:; img-src 'self' data: https:; script-src 'self' 'wasm-unsafe-eval' https://giscus.app; frame-src https://giscus.app; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    location ^~ /_astro/ {
        expires 1y;
        access_log off;
    }

    location ^~ /pagefind/ {
        expires 1d;
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|ico|svg)$ {
        expires 1y;
        access_log off;
    }

    # robots.txt, sitemap and RSS feed
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~* \.(xml)$ {
        access_log off;
    }

    error_page 404 /404.html;

    # Astro's static build emits one index.html per route (e.g.
    # /posts/slug/index.html served at /posts/slug/) — try_files covers both
    # the extensionless route and a trailing-slash directory index.
    location / {
        try_files $uri $uri/ =404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
