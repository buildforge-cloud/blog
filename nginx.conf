server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression (Traefik also handles this, but keeping for redundancy)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json
               application/xml+rss image/svg+xml;

    # Astro's own build output: every file under /_astro/ has a content
    # hash baked into its filename, so it's safe to cache indefinitely.
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Pagefind's search index (unhashed filenames, but only fetched by the
    # search UI itself, not render-blocking) — moderate cache is enough.
    location ^~ /pagefind/ {
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # robots.txt, sitemap and RSS feed
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~* \.(xml)$ {
        access_log off;
    }

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; script-src 'self' https://giscus.app https://eu.i.posthog.com https://eu-assets.i.posthog.com; frame-src https://giscus.app; connect-src 'self' https://eu.i.posthog.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Always re-validate HTML so a new deploy shows up immediately
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    error_page 404 /404.html;

    # Astro's static build emits one index.html per route (e.g.
    # /posts/slug/index.html served at /posts/slug/) — try_files covers both
    # the extensionless route and a trailing-slash directory index.
    location / {
        try_files $uri $uri/ =404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
